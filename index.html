<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrainstO.</title>
<meta name="description" content="BrainstO. : préparer les réunions de l'équipe, ensemble.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BrainstO.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/product.css">
<!-- Le fond avant la feuille de style. Sans ces deux règles, l'agent
     utilisateur peint entre le premier rendu et le chargement de app.css :
     un flash blanc le jour, noir la nuit. Aucune requête réseau. -->
<style>html{background:#f5f7f9}@media(prefers-color-scheme:dark){html{background:#0c1317}}</style>
</head>
<body>
  <noscript>BrainstO. a besoin de JavaScript pour fonctionner.</noscript>
  <div id="app" class="app"></div>
  <div id="overlay-root"></div>
  <!-- La présentation initiale a sa propre racine : #overlay-root est
       mono-emplacement (renderOverlay le vide à chaque rendu), et le calque doit
       survivre aux rendus pour garder son focus et sa région d'annonce. -->
  <div id="onboarding-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/database.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/product-view.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/product-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
