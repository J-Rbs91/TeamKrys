name: Pandore (collecte quotidienne)

# Une fois par jour, ce qui a été déposé dans Pandore est ajouté au dépôt
# (pandore/depots/), dans un ordre aléatoire et sans heure, puis retiré du backend.
# Configuration : docs/PANDORE.md. Sans les deux secrets, la tâche ne fait rien.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pandore
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecter les dépôts
        env:
          BRAINSTO_SCRIPT_URL: ${{ secrets.BRAINSTO_SCRIPT_URL }}
          BRAINSTO_IDEAS_SECRET: ${{ secrets.BRAINSTO_IDEAS_SECRET }}
        run: node tools/pandore-collect.js
